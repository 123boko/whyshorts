  MAT.glassTube.opacity = 0.12 * Math.min(tubeS.vis, 1);

  if (snow.visible) {

      const y = 14 - ((t * sp + hash(i + 7) * 14) % 14);

}
function updateUI(t) {

    const bw = L.box.offsetWidth, bh = L.box.offsetHeight, ex = lx + bw * 0.5, ey = L.dy < 0 ? ly + bh : ly;
    const dx = ex - ax, dy = ey - ay, o = L.s.o;
    Object.assign(L.dot.style, { left: ax + 'px', top: ay + 'px', opacity: Math.min(L.s.d, 1) * o, transform: `scale(${L.s.d})` });
    Object.assign(L.leader.style, { left: ax + 'px', top: ay + 'px', width: Math.hypot(dx, dy) + 'px', opacity: (L.s.l > 0 ? 1 : 0) * o, transform: `rotate(${Math.atan2(dy, dx)}rad) scaleX(${L.s.l})` });
    Object.assign(L.box.style, { left: lx + 'px', top: ly + 'px', opacity: Math.min(L.s.b, 1) * o, transform: `scale(${0.6 + 0.4 * L.s.b})` });
  }
  for (const B of BADGES) {
    if (B.pnum) B.el.firstChild.nodeValue = Math.round(B.pnum.p) + ' PSI';
    if (B.pnum) B.el.className = 'badge ' + (B.pnum.p < 40 ? 'red' : 'green');
    const v = B.s.v; let top = B.top, left = 540;
    if (B.anchor) { const [x, y] = toScreen(B.anchor()); left = x; top = y + 30; }
    Object.assign(B.el.style, { left: left + 'px', top: top + 'px', opacity: Math.min(Math.max(v, 0), 1), transform: `translate(-50%, 0) scale(${0.6 + 0.4 * v})` });
  }
  for (const G of GAUGES) {
    const p = Math.max(0, Math.round(gaugeS.p + (gaugeS.p > 1 ? G.j : 0)));
    const [x, y, z] = toScreen(new THREE.Vector3(G.h.x, 10.5, G.h.z + 2));
    G.el.textContent = p + ' PSI'; G.el.style.background = p >= 40 ? 'rgba(24,140,64,0.95)' : p > 0 ? 'rgba(214,120,20,0.96)' : 'rgba(190,32,24,0.95)';
    G.el.style.borderTopColor = G.el.style.background;
    const v = gaugeS.v; Object.assign(G.el.style, { left: x + 'px', top: y + 'px', opacity: Math.min(Math.max(v, 0), 1) * (z < 1 ? 1 : 0), transform: `translate(-50%, -100%) scale(${0.5 + 0.5 * v})` });
  }

    const [x0, y0] = toScreen(D.from()), [x1, y1] = toScreen(D.to()); const v = D.s.v;
    const len = Math.max(Math.hypot(x1 - x0, y1 - y0), 1);
    Object.assign(D.bar.style, { left: x0 - 3 + 'px', top: y0 - len + 'px', height: len + 'px', opacity: Math.min(v, 1), transform: `scaleY(${Math.min(v, 1)})` });
    D.txt.textContent = D.textFn(); Object.assign(D.txt.style, { left: x0 + 30 + 'px', top: (y0 + y1) / 2 + 'px', opacity: Math.min(v, 1) });
  }

  document.getElementById('flash').style.opacity = fx.flash;
  const q = document.getElementById('q'); q.style.opacity = Math.min(fx.q, 1); q.style.transform = `scale(${0.5 + 0.5 * fx.q})`;
  let ci = -1; for (let i = 0; i < CHUNKS.length; i++) if (WORDS[CHUNKS[i][0]].start - 0.05 <= t) ci = i;
  const last = ci >= 0 ? WORDS[CHUNKS[ci][CHUNKS[ci].length - 1]] : null;
  const vis = ci >= 0 && (t <= last.end + 0.35 || (CHUNKS[ci + 1] && WORDS[CHUNKS[ci + 1][0]].start - 0.05 <= t));
  if (!vis) { capEl.innerHTML = ''; capShown = -1; return; }
  if (capShown !== ci) { capEl.innerHTML = CHUNKS[ci].map((i) => `<span>${WORDS[i].text.replace(/[.,?!:]$/, '')}</span>`).join(' '); capShown = ci; }
  let cur = -1; WORDS.forEach((x, i) => { if (x.start - 0.05 <= t) cur = i; });

}
window.renderAt = (t) => { tl.seek(Math.max(t, 0.0005), false); update(t); updateUI(t); composer.render(); return true; };
window.meta = { FPS, DURATION };

Promise.all([document.fonts.load('900 60px WS'), document.fonts.load('800 40px WS')]).then(() => {
