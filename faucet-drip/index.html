// A turned (lathe) part, cut in half on x<=0 like the rest of the cutaway, with painted section faces.
// profile: closed list of [r, y] points, counter-clockwise.
function turned(profile, mat, cutMat = MAT.SectionFace, segs = 64, full = false) {
  const g = new THREE.Group();
  const pts = profile.map(([r, y]) => new THREE.Vector2(r, y));
  const parts = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    if (a.distanceTo(b) < 1e-7) continue;
    const lg = full ? new THREE.LatheGeometry([a, b], segs * 2) : new THREE.LatheGeometry([a, b], segs, Math.PI, Math.PI);
    parts.push(lg.toNonIndexed());

  const body = new THREE.Mesh(mergeGeometries(parts), mat); body.castShadow = body.receiveShadow = true; g.add(body);

    const f = new THREE.Mesh(new THREE.ShapeGeometry(shape), cutMat);
    f.rotation.y = -s * Math.PI / 2; f.receiveShadow = true; g.add(f);
  }
  return g;
}

      ? `vec3 transformed = position; float s = position.z; float a = atan(position.y, position.x);

  // rubber parts, built in the stem's / bonnet's own coordinates

const tmp = new THREE.Vector3(), dummy = new THREE.Object3D();
function toScreen(v) { v.project(camera); return [(v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H]; }
const hash = (i) => { const s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); };

function updateCamera(t) {

  const n = (k) => Math.sin(t * 37.1 + k) * 0.6 + Math.sin(t * 61.7 + k * 2.3) * 0.4;

}
function updateStem() {
  const st = N.StemRig; if (!st) return;
  st.position.y = yB + stem.L; st.rotation.y = rOpen + (stem.L - 0.0065) * K + stem.extra;
}
function updateJet(t) {
  const p = jetState.p;
  jet.scale.set(Math.max(p, 0.001), Math.max(p, 0.001), 1);
  spray.visible = jetRig.visible && p > 0.01;
  if (!spray.visible) return;
  for (let i = 0; i < SPRAY_N; i++) {
    const ph = hash(i + 1), life = (t * 1.7 + ph) % 1, ang = hash(i + 7) * Math.PI * 2;
    const rad = 0.007 + life * (0.004 + 0.045 * hash(i + 3) * hash(i + 3));
    dummy.position.set(Math.cos(ang) * rad, 1.080 + Math.sin(ang) * rad - life * life * 0.035, 0.11 + life * 0.30);
    const s = (0.0007 + 0.0017 * hash(i + 11)) * (1 - life * 0.4) * p;

}
function updateDrips(t) {

  let k = 0;
  for (const d0 of DRIPS) {
    const a = t - d0; if (a < 0 || a > 0.95 || k >= drops.length) continue;
    const m = drops[k++]; m.visible = true;
    if (a < 0.62) { const g = Math.min(a / 0.62, 1), r = 0.0034 * Math.pow(g, 0.6); m.scale.set(r, r * (1 + 0.35 * g), r); m.position.set(TIP.x, TIP.y - r * (0.6 + 0.4 * g), TIP.z); }
    else { const f = a - 0.62, r = 0.0032; m.scale.set(r * 0.9, r * 1.3, r * 0.9); m.position.set(TIP.x, TIP.y - r - 4.9 * f * f - 0.02 * f, TIP.z); }
  }
}
function updateCart() {

}

  }
  if (ring.anchor) {
    const [x, y] = toScreen(ring.anchor()), v = ring.s.v, pulse = 1 + 0.08 * Math.sin(t * 12);
    Object.assign(ring.el.style, { left: x + 'px', top: y + 'px', opacity: Math.min(Math.max(v, 0), 1), transform: `scale(${v * pulse})` });
    ring.txt.textContent = ring.text;
    Object.assign(ring.txt.style, { left: x + 80 + 'px', top: y - 30 + 'px', opacity: Math.min(Math.max(v, 0), 1) });
  }
  if (xm.anchor) {
    const [x, y] = toScreen(xm.anchor()), v = xm.s.v;
    Object.assign(xm.el.style, { left: x + 'px', top: y + 'px', opacity: Math.min(Math.max(v, 0), 1), transform: `scale(${v})` });
  }
  document.getElementById('vig').style.opacity = fx.vig;
  document.getElementById('flash').style.opacity = fx.flash;
  document.getElementById('black').style.opacity = fx.black;
  const q = document.getElementById('q'); q.style.opacity = Math.min(fx.q, 1); q.style.transform = `scale(${0.5 + 0.5 * fx.q})`;
  // captions
  let ci = -1;
  for (let i = 0; i < CHUNKS.length; i++) if (WORDS[CHUNKS[i][0]].start - 0.05 <= t) ci = i;
  const last = ci >= 0 ? WORDS[CHUNKS[ci][CHUNKS[ci].length - 1]] : null;
  const visible = ci >= 0 && (t <= last.end + 0.35 || (CHUNKS[ci + 1] && WORDS[CHUNKS[ci + 1][0]].start - 0.05 <= t));
  if (!visible) { capEl.innerHTML = ''; capShown = -1; return; }
  if (capShown !== ci) { capEl.innerHTML = CHUNKS[ci].map((i) => `<span>${WORDS[i].text.replace(/[.,?!:]$/, '')}</span>`).join(' '); capShown = ci; }
  let cur = -1; WORDS.forEach((x, i) => { if (x.start - 0.05 <= t) cur = i; });
  [...capEl.children].forEach((s, j) => { s.className = CHUNKS[ci][j] === cur ? 'on' : ''; });
}

window.renderAt = (t) => {
  tl.seek(Math.max(t, 0.0005), false); uT.value = t;
  updateStem(); updateJet(t); updateDrips(t); updateCart(); updateCamera(t); updateUI(t);
  composer.render(); return true;
};
window.meta = { FPS, DURATION };

// ---------- load ----------
const pmrem = new THREE.PMREMGenerator(renderer);
Promise.all([
  new HDRLoader().loadAsync('tex/studio.hdr'),
  new GLTFLoader().loadAsync('valve_real.glb'),
  document.fonts.load('900 60px WS'), document.fonts.load('800 40px WS'),
]).then(([hdr, g]) => {
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  const makeEnv = () => { scene.environment = pmrem.fromEquirectangular(hdr).texture; };
  renderer.domElement.addEventListener('webglcontextrestored', () => setTimeout(makeEnv, 0));
  makeEnv(); scene.environmentIntensity = 1.15; scene.environmentRotation.set(0, 2.2, 0);
  scene.add(g.scene);
  g.scene.traverse((o) => { if (o.name) N[o.name] = o; });
  const meshes = []; g.scene.traverse((o) => { if (o.isMesh) meshes.push(o); });
  meshes.forEach((o) => {
    const name = o.material?.name || '';
    o.material = MAT[name] || MAT.Brass;
    o.castShadow = name !== 'Water'; o.receiveShadow = true;
  });
  try { build(); } catch (e) { console.log('BUILD ERROR ' + e.message + ' ' + e.stack); }
  window.renderAt(0);
  const gl = renderer.getContext();
  const settle = () => new Promise((r) => setTimeout(r, 500));
  (async () => {
    for (let i = 0; i < 40; i++) {
      await settle();
      if (!gl.isContextLost()) { composer.render(); await settle(); if (!gl.isContextLost()) break; }
    }
    ready(!gl.isContextLost());
  })();
}).catch((e) => { console.log('LOAD ERROR ' + e.message); ready(false); });
</script>
</body>
