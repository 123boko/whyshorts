function turned(profile, mat, cutMat, segs = 64, full = false) {
  const g = new THREE.Group(), inner = new THREE.Group(); g.add(inner); inner.rotation.y = -Math.PI / 2;
  const pts = profile.map(([r, y]) => new THREE.Vector2(r, y)), parts = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length]; if (a.distanceTo(b) < 1e-7) continue;
    parts.push((full ? new THREE.LatheGeometry([a, b], segs * 2) : new THREE.LatheGeometry([a, b], segs, Math.PI, Math.PI)).toNonIndexed());
  }
  const body = new THREE.Mesh(mergeGeometries(parts), mat); body.castShadow = body.receiveShadow = true; inner.add(body);
  if (!full) { const sh = new THREE.Shape(pts); for (const s of [-1, 1]) { const f = new THREE.Mesh(new THREE.ShapeGeometry(sh), cutMat); f.rotation.y = -s * Math.PI / 2; f.receiveShadow = true; inner.add(f); } }
  return g;
}

// ---------- Poly Haven HDRIs: background, reflections and the sun direction ----------
const HDR = {}; sky.visible = false;
function sunFromHDR(texData) {

  for (let y = 0; y < h / 2; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * step, l = data[i] + data[i + 1] + data[i + 2]; if (l > best) { best = l; bx = x; by = y; } }

}
function applyHDR() {

  if (H0) { scene.background = H0.bg; scene.environment = H0.env; scene.backgroundRotation.set(0, H0.rot, 0); scene.environmentRotation.set(0, H0.rot, 0);
    const d = H0.sun.clone().applyEuler(new THREE.Euler(0, H0.rot, 0)); if (d.y < 0.35) { d.y = 0.35; } d.normalize();
    sun.target.position.set(0, 0, CZ - 4); sun.position.copy(sun.target.position).addScaledVector(d, 120); }
  scene.backgroundIntensity = skyS.bg; scene.environmentIntensity = skyS.env;
  sun.intensity = skyS.sun; sun.color.setRGB(skyS.sr, skyS.sg, skyS.sb); hemi.intensity = skyS.hemi; renderer.toneMappingExposure = skyS.exp;

// ---------- per-frame ----------
const dummy = new THREE.Object3D(), tmp = new THREE.Vector3();
const hash = (i) => { const s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); };
function toScreen(v) { tmp.copy(v).project(camera); return [(tmp.x * 0.5 + 0.5) * W, (-tmp.y * 0.5 + 0.5) * H, tmp.z]; }
function setCol(g, y0, y1) { // place a unit water column between two heights

}
function update(t) {

  camera.position.set(cam.x + dx, cam.y + dy, cam.z + dz); camera.lookAt(cam.tx + dx * 0.3, cam.ty + dy * 0.3, cam.tz); camera.updateMatrixWorld();
  applyHDR();
  const nightK = THREE.MathUtils.clamp((5 - skyS.elev) / 10, 0, 1); LAMPS.forEach((m) => (m.emissiveIntensity = 3 * nightK));

  HP.rod.rotation.y = hydS.turn * Math.PI * 2; HP.nut.rotation.y = hydS.turn * Math.PI * 2;
  steelRod.emissiveIntensity = 0.9 * hydS.rodGlow;

  const aEnd = Math.min(vb - 0.032, hydS.bl);

  seg(bLow, bUp, bTop, vb, Math.max(hydS.level, vb));

  jetOut.visible = hydS.jet > 0.01; jetOut.scale.set(hydS.jet, hydS.jet, 1); jetOut.position.y = 0.56;
  drainJet.visible = hydS.drainJet > 0.01 && hydS.level > vb + 0.02; drainJet.scale.set(0.18 * hydS.drainJet, 1, 1); drainJet.rotation.z = 0.55;

  loneA.position.x = -0.03 * loneS.crack; loneA.rotation.z = 0.06 * loneS.crack; loneB.position.x = 0.03 * loneS.crack; loneB.rotation.z = -0.05 * loneS.crack;
  iceBulge.scale.set(0.5 * loneS.bulge + 0.001, 0.9 * loneS.bulge + 0.001, 0.9 * loneS.bulge + 0.001);

  // fire flicker in the window of house 3

  HOUSES[1].winMat.emissive.setRGB(1, 0.45, 0.12); HOUSES[1].winMat.emissiveIntensity = Math.max(4 * fl, 0);
  // snow

  if (snow.visible) {
    const c = new THREE.Vector3(cam.tx, cam.ty, cam.tz), span = Math.max(Math.hypot(cam.x - cam.tx, cam.y - cam.ty, cam.z - cam.tz), 2);
    for (let i = 0; i < SNOW_N; i++) {
      const x = c.x + (hash(i) - 0.5) * span * 0.9, z = c.z - span * 0.6 + hash(i + 3) * span * 0.75, sp = 0.5 + 0.5 * hash(i + 5), Hh = span * 0.9;
      const y = c.y + Hh / 2 - ((t * sp * span * 0.12 + hash(i + 7) * Hh) % Hh);

    }

}
function updateUI(t) {

    const bw = L.box.offsetWidth, bh = L.box.offsetHeight, ex = lx + bw * 0.5, ey = L.dy < 0 ? ly + bh : ly;

  let ci = -1; for (let i = 0; i < CHUNKS.length; i++) if (WORDS[CHUNKS[i][0]].start - 0.05 <= t) ci = i;
